# Build the Olesia iOS app on GitHub's macOS runners.
#
# Why this exists: iOS builds need a Mac with Xcode. This runs on Apple hardware
# in the cloud, free and unmetered for public repos — so no local Mac is needed.
#
# Stage 1 (now, no Apple account): compiles the app for the Simulator and produces
#   an UNSIGNED archive. Proves the app builds. Artifacts are downloadable.
# Stage 2 (later, once the Apple Developer account exists): add the repo secrets
#   listed at the bottom and the `testflight` job publishes automatically.
name: iOS

on:
  push:
    branches: [main]
    paths: ['mobile/**', 'packages/bitcoin/web/**', '.github/workflows/ios.yml']
  pull_request:
    paths: ['mobile/**', 'packages/bitcoin/web/**']
  workflow_dispatch:        # lets you press "Run workflow" by hand in the browser

concurrency:
  group: ios-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build (unsigned)
    runs-on: macos-14        # Apple silicon runner, Xcode 15.x
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Show toolchain
        run: |
          echo "macOS: $(sw_vers -productVersion)"
          echo "Xcode: $(xcodebuild -version | head -1)"
          echo "Node:  $(node -v)"
          echo "Pods:  $(pod --version)"

      - name: Install Capacitor
        working-directory: mobile
        run: npm ci || npm install

      - name: Install the wallet's build deps (so www/ is rebuilt from source)
        working-directory: packages/bitcoin
        run: npm install --no-audit --no-fund || true

      - name: Bundle the wallet into www/
        working-directory: mobile
        run: npm run prepare-www

      - name: Generate the native iOS project
        working-directory: mobile
        run: |
          # ios/ is not committed — Capacitor generates it, then pulls CocoaPods
          if [ ! -d ios ]; then npx cap add ios; fi
          npx cap sync ios

      - name: Build for the Simulator (no signing needed)
        working-directory: mobile/ios/App
        run: |
          set -o pipefail
          xcodebuild \
            -workspace App.xcworkspace \
            -scheme App \
            -configuration Debug \
            -sdk iphonesimulator \
            -destination 'generic/platform=iOS Simulator' \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO \
            build | xcpretty || \
          xcodebuild \
            -workspace App.xcworkspace \
            -scheme App \
            -configuration Debug \
            -sdk iphonesimulator \
            -destination 'generic/platform=iOS Simulator' \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO \
            build

      - name: Archive unsigned (proves a release build compiles)
        working-directory: mobile/ios/App
        run: |
          xcodebuild archive \
            -workspace App.xcworkspace \
            -scheme App \
            -configuration Release \
            -archivePath "$RUNNER_TEMP/Olesia.xcarchive" \
            -destination 'generic/platform=iOS' \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" PROVISIONING_PROFILE_SPECIFIER=""

      - name: Package the simulator app
        run: |
          APP=$(find mobile/ios/App/build/Build/Products -name "*.app" -maxdepth 3 | head -1)
          echo "found: $APP"
          mkdir -p "$RUNNER_TEMP/out"
          [ -n "$APP" ] && cp -R "$APP" "$RUNNER_TEMP/out/" || true
          cp -R "$RUNNER_TEMP/Olesia.xcarchive" "$RUNNER_TEMP/out/" || true

      - uses: actions/upload-artifact@v4
        with:
          name: olesia-ios-unsigned
          path: ${{ runner.temp }}/out
          retention-days: 14
          if-no-files-found: warn

  # ---------------------------------------------------------------------------
  # Stage 2 — publish to TestFlight. Skipped automatically until the secrets are
  # set, so the workflow stays green in the meantime.
  #
  # Repo secrets required (Settings → Secrets and variables → Actions):
  #   APPSTORE_ISSUER_ID     App Store Connect API key issuer id
  #   APPSTORE_KEY_ID        API key id
  #   APPSTORE_PRIVATE_KEY   contents of the .p8 API key
  #   BUILD_CERTIFICATE_B64  base64 of your Apple distribution .p12
  #   P12_PASSWORD           password for that .p12
  #   PROVISIONING_PROFILE_B64  base64 of the App Store provisioning profile
  # ---------------------------------------------------------------------------
  testflight:
    name: Publish to TestFlight
    needs: build
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    runs-on: macos-14
    timeout-minutes: 45
    steps:
      - name: Check whether signing secrets exist
        id: gate
        run: |
          if [ -n "${{ secrets.APPSTORE_ISSUER_ID }}" ] && [ -n "${{ secrets.BUILD_CERTIFICATE_B64 }}" ]; then
            echo "ready=true" >> "$GITHUB_OUTPUT"
          else
            echo "ready=false" >> "$GITHUB_OUTPUT"
            echo "::notice::Apple signing secrets not set yet — skipping TestFlight upload. The unsigned build above still ran."
          fi

      - uses: actions/checkout@v4
        if: steps.gate.outputs.ready == 'true'
      - uses: actions/setup-node@v4
        if: steps.gate.outputs.ready == 'true'
        with:
          node-version: '20'

      - name: Install signing assets
        if: steps.gate.outputs.ready == 'true'
        env:
          CERT_B64: ${{ secrets.BUILD_CERTIFICATE_B64 }}
          P12_PASSWORD: ${{ secrets.P12_PASSWORD }}
          PROFILE_B64: ${{ secrets.PROVISIONING_PROFILE_B64 }}
        run: |
          KEYCHAIN="$RUNNER_TEMP/build.keychain-db"
          KEYCHAIN_PW=$(uuidgen)
          echo "$CERT_B64" | base64 --decode > "$RUNNER_TEMP/cert.p12"
          security create-keychain -p "$KEYCHAIN_PW" "$KEYCHAIN"
          security set-keychain-settings -lut 21600 "$KEYCHAIN"
          security unlock-keychain -p "$KEYCHAIN_PW" "$KEYCHAIN"
          security import "$RUNNER_TEMP/cert.p12" -P "$P12_PASSWORD" -A -t cert -f pkcs12 -k "$KEYCHAIN"
          security list-keychain -d user -s "$KEYCHAIN"
          mkdir -p ~/Library/MobileDevice/Provisioning\ Profiles
          echo "$PROFILE_B64" | base64 --decode > ~/Library/MobileDevice/Provisioning\ Profiles/olesia.mobileprovision

      - name: Build, sign and upload
        if: steps.gate.outputs.ready == 'true'
        working-directory: mobile
        env:
          APPSTORE_ISSUER_ID: ${{ secrets.APPSTORE_ISSUER_ID }}
          APPSTORE_KEY_ID: ${{ secrets.APPSTORE_KEY_ID }}
          APPSTORE_PRIVATE_KEY: ${{ secrets.APPSTORE_PRIVATE_KEY }}
        run: |
          npm ci || npm install
          npm run prepare-www
          if [ ! -d ios ]; then npx cap add ios; fi
          npx cap sync ios
          cd ios/App
          xcodebuild archive \
            -workspace App.xcworkspace -scheme App -configuration Release \
            -archivePath "$RUNNER_TEMP/Olesia.xcarchive" \
            -destination 'generic/platform=iOS' \
            -allowProvisioningUpdates
          cat > "$RUNNER_TEMP/ExportOptions.plist" <<'PLIST'
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0"><dict>
            <key>method</key><string>app-store</string>
            <key>uploadSymbols</key><true/>
          </dict></plist>
          PLIST
          xcodebuild -exportArchive \
            -archivePath "$RUNNER_TEMP/Olesia.xcarchive" \
            -exportOptionsPlist "$RUNNER_TEMP/ExportOptions.plist" \
            -exportPath "$RUNNER_TEMP/export" \
            -allowProvisioningUpdates
          mkdir -p ~/private_keys
          echo "$APPSTORE_PRIVATE_KEY" > ~/private_keys/AuthKey_${APPSTORE_KEY_ID}.p8
          xcrun altool --upload-app -f "$RUNNER_TEMP/export"/*.ipa -t ios \
            --apiKey "$APPSTORE_KEY_ID" --apiIssuer "$APPSTORE_ISSUER_ID"
