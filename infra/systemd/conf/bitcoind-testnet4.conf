# Olesia testnet pruned node — managed; runs as 'faucet', cookie auth. Sync-first config
# (ZMQ intentionally omitted until IBD is healthy; will be added for alerts afterwards).
testnet4=1
disablewallet=1
server=1
prune=5000
dbcache=2048
maxmempool=100
par=0

[testnet4]
rpcbind=127.0.0.1
rpcallowip=127.0.0.1
rpcport=48332
